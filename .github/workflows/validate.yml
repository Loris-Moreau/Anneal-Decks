name: Validate decks

on:
  pull_request:
    paths:
      - "decks/**"
      - "index.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # On pull_request events HEAD is the merge commit and HEAD^1 is the base branch tip.
      - name: PRs must not edit index.json (CI regenerates it)
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qx 'index.json'; then
            echo "::error file=index.json::index.json is generated by CI. Remove it from this PR."
            exit 1
          fi

      # The validator lives in the app repo. Pin ANNEAL_REF (repo variable) to a tag once the app is released.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Anneal
          ref: ${{ vars.ANNEAL_REF || 'main' }}
          path: .anneal

      - uses: pnpm/action-setup@v4
        with:
          version: latest
          package_json_file: .anneal/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install validator
        working-directory: .anneal
        run: pnpm install --frozen-lockfile

      - name: Validate decks
        working-directory: .anneal
        run: pnpm anneal validate "$GITHUB_WORKSPACE/decks" --github
