name: Publish index and release

on:
  push:
    branches: [main]
    paths:
      - "decks/**"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Anneal
          ref: ${{ vars.ANNEAL_REF || 'main' }}
          path: .anneal

      - uses: pnpm/action-setup@v4
        with:
          version: latest
          package_json_file: .anneal/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        working-directory: .anneal
        run: pnpm install --frozen-lockfile

      - name: Validate decks
        working-directory: .anneal
        run: pnpm anneal validate "$GITHUB_WORKSPACE/decks" --github

      - name: Regenerate index.json
        working-directory: .anneal
        run: pnpm anneal index "$GITHUB_WORKSPACE/decks" --out "$GITHUB_WORKSPACE/index.json"

      # Needs permission to push to main (branch protection must allow github-actions[bot] or this repo must have none).
      - name: Commit index, tag, release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update index"
            git push origin HEAD:main
          fi
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
